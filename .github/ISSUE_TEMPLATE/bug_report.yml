name: Bug report
description: Report reproducible Foundry behavior
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commands, input artifact, expected result, and actual result. Remove all secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Foundry version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
